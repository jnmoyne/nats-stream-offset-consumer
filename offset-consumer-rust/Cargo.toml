[package]
name = "offset-consumer"
version = "0.1.0"
edition = "2021"
description = "NATS JetStream Offset Consumer Library for Rust"

[dependencies]
async-nats = "0.51"
nuid = "0.5"
hostname = "0.4"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
